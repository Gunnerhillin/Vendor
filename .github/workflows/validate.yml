name: Marketplace validation
on:
  pull_request:
  push:
    branches: [main, complete-launch-flow]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      STRIPE_SECRET_KEY: sk_test_local_build_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_local_build_placeholder
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-build-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/approval/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tests/approval
      - run: npm test
      - run: npm run build
